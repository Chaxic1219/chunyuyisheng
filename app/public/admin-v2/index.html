<!doctype html>
<html>
  <head>
    <title>春雨医服</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="春雨医服 — 医生团队医助与运营人员工作台，覆盖分诊、社群、随访与患者档案。"
    />
    <link rel="icon" type="image/png" href="/admin-v2/assets/favicon-tWYnxclS.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/admin-v2/assets/favicon-B1PbXmjg.ico" />
    <link rel="apple-touch-icon" href="/admin-v2/assets/apple-touch-icon-bgdR7k8m.png" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
    <script type="module" crossorigin src="/admin-v2/assets/index-j_dyliPa.js"></script>
    <link rel="stylesheet" crossorigin href="/admin-v2/assets/index-g8Z5GlDE.css">
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
